[package]
name = "difu"
version = "0.12.1"
edition = "2024"
rust-version = "1.90"
description = "Your diff shifu: Codex agents and guided pull request reviews"
license = "MIT"

[dependencies]
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
ratatui-image = { version = "=11.0.8", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
pulldown-cmark = { version = "0.13", default-features = false }
scraper = { version = "0.24", default-features = false }
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["osc52"] }
dirs = "6"
nix = { version = "0.30", features = ["signal", "process", "fs", "socket"] }
oxc_allocator = "=0.75.0"
oxc_ast = "=0.75.0"
oxc_parser = "=0.75.0"
oxc_semantic = "=0.75.0"
oxc_span = "=0.75.0"
jsonc-parser = { version = "0.26", features = ["serde"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
tempfile = "3"
textwrap = "0.16"
unicode-width = "0.2"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.16"
security-framework = "3"
tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
