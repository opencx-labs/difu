name: Rust
on:
  # Pull requests run once; pushes to main keep the shared build cache warm.
  push:
    branches: [main]
    paths:
      - cli/**
      - '!cli/docs/**'
      - '!cli/README.md'
      - .github/workflows/ci.yml
      - .github/workflows/release.yml
  pull_request:
    paths:
      - cli/**
      - '!cli/docs/**'
      - '!cli/README.md'
      - .github/workflows/ci.yml
      - .github/workflows/release.yml
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a pull request supersedes its older run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - name: Check release artifact selection and verification
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Dependencies compile once on main; pull requests restore them.
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: cli
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # macOS checks share the ARM package job in the release workflow.
      - run: cargo test --locked
