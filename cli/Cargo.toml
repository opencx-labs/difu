[package]
name = "difu"
version = "0.33.0"
edition = "2024"
rust-version = "1.90"
description = "Your diff shifu: Codex agents and guided pull request reviews"
license = "MIT"

[dependencies]
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
ratatui-image = { version = "=11.0.8", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
pulldown-cmark = { version = "0.13", default-features = false }
qrcode = { version = "0.14", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
scraper = { version = "0.24", default-features = false }
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["osc52"] }
dirs = "6"
nix = { version = "0.30", features = ["signal", "process", "fs", "socket", "net", "hostname"] }
oxc_allocator = "=0.75.0"
oxc_ast = "=0.75.0"
oxc_parser = "=0.75.0"
oxc_semantic = "=0.75.0"
oxc_span = "=0.75.0"
jsonc-parser = { version = "0.26", features = ["serde"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
tempfile = "3"
textwrap = "0.16"
tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
unicode-width = "0.2"
url = "2"
filedescriptor = "0.8.3"
portable-pty = "0.9.0"
vt100 = "0.18.1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = { version = "4.18", default-features = false, features = ["z"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = "5.19"

[profile.release]
lto = "thin"
strip = true

# Crossterm 0.29.0 loops forever when a terminal disconnects. Keep the released
# dependency graph and backport only the synchronous dead-TTY fix (see PATCHES.md).
[patch.crates-io]
crossterm = { path = "vendor/crossterm" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
